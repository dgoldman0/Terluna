name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: immersion/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r research/requirements.txt -r immersion/bake/requirements.txt
      - name: Install immersion dependencies
        working-directory: immersion
        run: npm ci
      - name: Run every check
        run: make check
      - name: Baked surface textures reproduce the committed manifest
        run: git diff --exit-code immersion/assets/surfaces/manifest.json
      - name: Build the immersion
        run: make build-immersion
